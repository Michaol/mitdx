[package]
name = "mitdx"
version = "0.1.0"
edition = "2021"
description = "High-performance TDX market data reader for Python, powered by Rust"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
